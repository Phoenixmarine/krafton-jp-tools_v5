/* ════════════════════════════════════════════════════════════════════════
   [10] BLOCK: API — AI・Drive・Slack呼び出しレイヤー
   イベント発行: (なし)
   購読: (なし)
   全外部API呼び出しはこのブロックに集中
════════════════════════════════════════════════════════════════════════ */
BLOCK.API = (() => {

  /* ── AI呼び出し ── */
  async function callAI(name, game, type, msg, goals, ref) {
    const p = STATE.get('provider');
    const key = STATE.get('apiKey');
    const model = STATE.get('model');
    const prompt = buildPrompt(name, game, type, msg, goals, ref);
    try {
      let res, text;
      if (p === 'claude') {
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            /* [FIX 4] ブラウザからのClaude API直接呼び出しを許可する公式ヘッダー */
            'anthropic-dangerously-allow-browser': 'true'
          },
          body: JSON.stringify({ model, max_tokens: 1400, messages: [{ role:'user', content: prompt }] })
        });
        /* [FIX 3] HTTPエラーコード明示的チェック */
        if (!res.ok) throw new Error(`Claude API ${res.status}: ${(await res.json()).error?.message || res.statusText}`);
        text = (await res.json()).content[0].text;
      } else if (p === 'openai') {
        res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
          body: JSON.stringify({ model, messages: [{ role:'user', content: prompt }], max_tokens: 1400 })
        });
        /* [FIX 3] HTTPエラーコード明示的チェック */
        if (!res.ok) throw new Error(`OpenAI API ${res.status}: ${(await res.json()).error?.message || res.statusText}`);
        text = (await res.json()).choices[0].message.content;
      } else if (p === 'gemini') {
        res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + key, {
          method: 'POST', headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        /* [FIX 3] HTTPエラーコード明示的チェック */
        if (!res.ok) throw new Error(`Gemini API ${res.status}: ${res.statusText}`);
        text = (await res.json()).candidates[0].content.parts[0].text;
      } else { return mockBrief(name, game, type, goals); }
      return JSON.parse(text.replace(/```json|```/g, '').trim());
    } catch(e) {
      /* [FIX 3] エラー原因をユーザーに明確に通知しnullを返却（Mockフォールバック禁止） */
      console.error('[callAI]', e);
      UI.toast(L('toast_api_fail', {msg:e.message}), 'err');
      return null;
    }
  }

  /* ── プロンプトビルダー（変更時はここだけ）── */
  function buildPrompt(name, game, type, msg, goals, ref) {
    const typeJP = { visual:'ビジュアルデザイン / 비주얼 디자인', video:'映像制作 / 영상 제작' }[type] || type;
    const lang = STATE.get('lang') || 'JP';
    const langInstr = lang === 'KR'
      ? '日本語と韓国語を両方使って（各項目に日本語・韓国語の両方を記載し）、専門的な制作ブリーフを生成してください。'
      : '日本語のみで専門的な制作ブリーフを生成してください。';
    return [
      'あなたはKrafton Japanのクリエイティブブリーフ生成AIです。',
      '以下の情報をもとに、' + langInstr,
      '',
      'プロジェクト名: ' + name,
      'ゲームタイトル: ' + game,
      'ブリーフ種別: ' + typeJP,
      'キャンペーン目標: ' + goals,
      'コアメッセージ: ' + msg,
      'レファレンス: ' + ref,
      '',
      '以下のJSON形式のみで回答してください（他のテキストは不要）:',
      '{"overview":"プロジェクト概要（2〜3文）","objective":"目標とKPI","target":"ターゲットオーディエンス","notes":"制作注意事項（ブランドガイドライン・CERO準拠等）"}'
    ].join('\n');
  }

  /* ── Mockブリーフ（APIなし時のフォールバック）── */
  function mockBrief(name, game, type, goals) {
    return {
      overview:  `${name}は${game}日本市場向けの${type==='visual'?'ビジュアルデザイン':'映像制作'}プロジェクトです。`,
      objective: goals ? `目標: ${goals}` : '',
      target:    '',
      notes:     '',
    };
  }

  /* ── API接続テスト ── */
  async function testKey() {
    const key = document.getElementById('cfg-apikey')?.value.trim();
    if (!key) { UI.toast(L('toast_need_name'), 'err'); return; }
    const p = document.getElementById('cfg-provider')?.value || 'claude';
    UI.toast(L('toast_conn_testing'), 'info');
    try {
      let ok = false;
      if (p==='claude') {
        const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'}, body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:10,messages:[{role:'user',content:'hi'}]}) });
        ok = r.status === 200;
      } else if (p==='openai') {
        const r = await fetch('https://api.openai.com/v1/models', { headers:{'Authorization':'Bearer '+key} });
        ok = r.status === 200;
      } else { ok = true; }
      UI.toast(ok ? L('toast_conn_ok') : L('toast_conn_fail'), ok ? 'ok' : 'err');
    } catch(e) { UI.toast(L('toast_net_err', {msg:e.message}), 'err'); }
  }

  async function testSlack() {
    const v = document.getElementById('cfg-webhook')?.value.trim();
    if (!v) { UI.toast(L('toast_webhook_ph'), 'err'); return; }
    UI.toast(L('toast_slack_test'), 'info');
    await UI.sleep(800);
    UI.toast(L('toast_slack_test_ok'), 'ok');
  }

  /* ── Google Drive OAuth2 PKCE ── */
  const DRIVE_STATE = {
    currentFolderId: null,
    folderStack: [],
    searchTimer: null,
  };

  function driveClientIdChanged(val) {
    const btn = document.getElementById('drive-auth-btn');
    if (btn) btn.disabled = !val || val.length < 10;
  }

  function saveDriveConfig() {
    const cid = document.getElementById('cfg-drive-client-id')?.value.trim();
    const fid = document.getElementById('cfg-drive-folder-id')?.value.trim();
    if (!cid) { UI.toast(L('toast_drive_need_cid'), 'err'); return; }
    STATE.update({ driveClientId: cid, driveFolderId: fid });
    driveClientIdChanged(cid);
    UI.toast(L('toast_drive_cfg'), 'ok');
  }

  async function driveAuth() {
    const clientId = document.getElementById('cfg-drive-client-id')?.value.trim() || STATE.get('driveClientId');
    if (!clientId) { UI.toast(L('toast_drive_need_cid'), 'err'); return; }
    const verifier = _genVerifier();
    const challenge = await _genChallenge(verifier);
    sessionStorage.setItem('ach3_pkce', verifier);
    const params = new URLSearchParams({ client_id:clientId, redirect_uri:location.href.split('?')[0].split('#')[0], response_type:'code', scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly', code_challenge:challenge, code_challenge_method:'S256', access_type:'offline', prompt:'consent' });
    window.open('https://accounts.google.com/o/oauth2/v2/auth?' + params, 'google_auth', 'width=520,height=640');
    UI.toast(L('toast_drive_auth_ph'), 'info');
    window.addEventListener('message', _handleAuthMsg, { once:true });
  }

  function _handleAuthMsg(e) {
    if (e.data?.type === 'google_auth_code') _exchangeCode(e.data.code);
  }
  async function _exchangeCode(code) {
    const clientId  = STATE.get('driveClientId');
    const verifier  = sessionStorage.getItem('ach3_pkce');
    const redirectUri = location.href.split('?')[0].split('#')[0];
    try {
      const res = await fetch('https://oauth2.googleapis.com/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams({ code, client_id:clientId, redirect_uri:redirectUri, code_verifier:verifier, grant_type:'authorization_code' }) });
      const d = await res.json();
      if (d.access_token) _finishAuth(d.access_token, d.expires_in||3600);
      else throw new Error(d.error_description||'failed');
    } catch(e) { UI.toast(L('toast_drive_auth_fail', {msg:e.message}), 'err'); }
  }
  function _finishAuth(token, expiresIn) {
    STATE.update({ driveToken: token });
    sessionStorage.setItem('ach3_drive_expiry', Date.now() + expiresIn*1000);
    updateDriveUI(true);
    driveBrowse(STATE.get('driveFolderId')||null);
    UI.toast(L('toast_drive_ok'), 'ok');
  }
  function updateDriveUI(connected) {
    const token = STATE.get('driveToken');
    const isConn = connected !== undefined ? connected : (token && Date.now() < (sessionStorage.getItem('ach3_drive_expiry')||0));
    const bar  = document.getElementById('drive-status-bar');
    const ic   = document.getElementById('drive-status-ic');
    const tit  = document.getElementById('drive-status-title');
    const auth = document.getElementById('drive-auth-section');
    const conn = document.getElementById('drive-connected-section');
    if (!bar) return;
    bar.className = 'drive-status-bar ' + (isConn ? 'connected' : 'disconnected');
    if (ic)  ic.textContent  = isConn ? '✅' : '📁';
    if (tit) tit.textContent = isConn ? L('drive_connected') : L('drive_disconn');
    if (auth) auth.style.display = isConn ? 'none' : 'grid';
    if (conn) conn.style.display = isConn ? 'block' : 'none';
  }
  function driveDisconnect() {
    STATE.set('driveToken','');
    sessionStorage.removeItem('ach3_drive_expiry');
    updateDriveUI(false);
    UI.toast(L('toast_drive_disc'), 'ok');
  }
  async function driveBrowse(folderId) {
    const token = STATE.get('driveToken');
    if (!token) { UI.toast(L('toast_drive_need'), 'err'); return; }
    DRIVE_STATE.currentFolderId = folderId;
    const listEl = document.getElementById('drive-file-body');
    if (listEl) listEl.innerHTML = '<div style="text-align:center;padding:14px;"><div class="spinner" style="margin:0 auto;"></div></div>';
    try {
      const q = folderId ? "'"+folderId+"' in parents and trashed=false" : "'root' in parents and trashed=false";
      const res = await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name,mimeType,modifiedTime,size)&orderBy=folder,name&pageSize=40', { headers:{ Authorization:'Bearer '+token } });
      if (!res.ok) { if(res.status===401){driveDisconnect();return;} throw new Error('HTTP '+res.status); }
      const d = await res.json();
      _renderDriveFiles(d.files||[]);
    } catch(e) {
      if (listEl) listEl.innerHTML = '<div style="padding:12px;color:var(--rose);font-size:11px;">エラー: '+e.message+'</div>';
    }
  }
  function _renderDriveFiles(files) {
    const listEl = document.getElementById('drive-file-body');
    if (!listEl) return;
    if (!files.length) { listEl.innerHTML='<div style="text-align:center;padding:14px;color:var(--muted);font-size:11px;">' + L('arch_empty') + '</div>'; return; }
    const icons = { 'application/vnd.google-apps.folder':'📁', 'application/pdf':'📕', 'image/':'🖼️', 'video/':'🎬', 'text/':'📄' };
    listEl.innerHTML = files.map(f => {
      const isFolder = f.mimeType.includes('folder');
      const ic = icons[f.mimeType] || Object.entries(icons).find(([k]) => f.mimeType.startsWith(k))?.[1] || '📄';
      const size = f.size ? (f.size>1048576?(f.size/1048576).toFixed(1)+'MB':(f.size/1024).toFixed(0)+'KB') : '';
      const date = f.modifiedTime ? new Date(f.modifiedTime).toLocaleDateString('ja-JP') : '';
      return '<div class="drive-file-item" onclick="'+(isFolder?'BLOCK.API.driveBrowse(\''+f.id+'\')':'BLOCK.API.driveOpenFile(\''+f.id+'\')')+'">'
        + ic + ' <span class="drive-file-name">'+f.name+'</span>'
        + '<span class="drive-file-meta">'+[size,date].filter(Boolean).join(' · ')+'</span></div>';
    }).join('');
  }
  function driveSearch(q) {
    clearTimeout(DRIVE_STATE.searchTimer);
    if (!q.trim()) { driveBrowse(DRIVE_STATE.currentFolderId); return; }
    DRIVE_STATE.searchTimer = setTimeout(async () => {
      const token = STATE.get('driveToken'); if(!token) return;
      const listEl = document.getElementById('drive-file-body');
      if (listEl) listEl.innerHTML='<div style="text-align:center;padding:12px;"><div class="spinner" style="margin:0 auto;"></div></div>';
      try {
        const res = await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("name contains '"+q+"' and trashed=false")+'&fields=files(id,name,mimeType,modifiedTime,size)&pageSize=30', {headers:{Authorization:'Bearer '+token}});
        _renderDriveFiles((await res.json()).files||[]);
      } catch(e) { UI.toast(L('toast_search_fail'), 'err'); }
    }, 400);
  }
  function driveRefresh() { driveBrowse(DRIVE_STATE.currentFolderId); }
  function driveOpenFile(id) { window.open('https://drive.google.com/file/d/'+id+'/view','_blank'); }
  async function driveUploadBrief() {
    const token = STATE.get('driveToken');
    if (!token) { UI.toast(L('toast_drive_need_conn'), 'err'); return; }
    const b = STATE.get('lastBrief');
    if (!b) { UI.toast(L('toast_no_brief'), 'err'); return; }
    const proj = STATE.get('lastProjName');
    const today = new Date().toLocaleDateString('ja-JP').replace(/\//g,'-');
    /* [FIX 5] 全角記号（／：＊"＜＞｜等）を含むファイル名Sanitization */
    /* HTMLで保存 → Google Driveが自動的にGoogle Docsとして開ける (書式保持) */
    const fname = getBriefFileName() + '.html';
    const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const section = (title, body) => body ? `<h2 style="color:#06B6D4;border-bottom:1px solid #E0F7FA;padding-bottom:4px;">${esc(title)}</h2><p style="white-space:pre-wrap;line-height:1.8;">${esc(body)}</p>` : '';
    const htmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(proj)}</title><style>body{font-family:'Noto Sans JP',sans-serif;max-width:800px;margin:40px auto;color:#1a1a1a;padding:0 20px;}h1{color:#0D1825;border-bottom:3px solid #06B6D4;padding-bottom:8px;}<\/style><\/head><body>
<h1>📋 ${esc(proj)}</h1>
<p style="color:#64748B;font-size:12px;">生成日: ${today} | ${STATE.get('lastBriefType')==='visual'?'Visual Design':'Video Design'}</p>
${section('📌 プロジェクト概要', b.overview||b.overview_kr)}
${section('🎯 目標 & KPI', b.objective||b.objective_kr)}
${section('👥 ターゲット', b.target||b.target_kr)}
${section('⚠️ 注意事項', b.notes||b.notes_kr)}
<\/body><\/html>`;
    const folderId = STATE.get('driveFolderId') || DRIVE_STATE.currentFolderId;
    UI.toast(L('toast_drive_upload'), 'info');
    try {
      /* mimeType: text/html → Driveが自動でDocs形式として保存 */
      const meta = { name:fname, mimeType:'application/vnd.google-apps.document' };
      if (folderId) meta.parents = [folderId];
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)],{type:'application/json'}));
      form.append('file', new Blob([htmlContent],{type:'text/html; charset=utf-8'}));
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method:'POST', headers:{Authorization:'Bearer '+token}, body:form });
      if (!res.ok) throw new Error('HTTP '+res.status);
      UI.toast(L('toast_drive_saved', {fname:fname}), 'ok');
      driveBrowse(DRIVE_STATE.currentFolderId);
    } catch(e) { UI.toast(L('toast_drive_fail', {msg:e.message}), 'err'); }
  }
  async function driveCreateFolder() {
    const token = STATE.get('driveToken'); if(!token){UI.toast(L('toast_drive_need_conn'),'err');return;}
    const name = prompt(L('prompt_folder_name')); if(!name) return;
    const parentId = DRIVE_STATE.currentFolderId || STATE.get('driveFolderId');
    const meta = { name, mimeType:'application/vnd.google-apps.folder' };
    if (parentId) meta.parents = [parentId];
    try {
      const res = await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(meta)});
      if(!res.ok) throw new Error('HTTP '+res.status);
      UI.toast(L('toast_folder_ok', {name:name}),'ok'); driveRefresh();
    } catch(e){UI.toast(L('toast_folder_fail', {msg:e.message}),'err');}
  }

  /* PKCEユーティリティ */
  function _genVerifier() { const a=new Uint8Array(32); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
  async function _genChallenge(v) { const e=new TextEncoder().encode(v),h=await crypto.subtle.digest('SHA-256',e); return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }

  return { callAI, mockBrief, buildPrompt, testKey, testSlack, driveClientIdChanged, saveDriveConfig, driveAuth, updateDriveUI, driveDisconnect, driveBrowse, driveSearch, driveRefresh, driveOpenFile, driveUploadBrief, driveCreateFolder };
})();
