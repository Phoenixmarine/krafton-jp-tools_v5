<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Creator Hub v4 – Krafton Japan</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- ════════════════════════════════════════════════════════════════════════
  AI CREATOR HUB v4 — Krafton Japan
  ─────────────────────────────────
  BLOCKの構造（順番に読んでください）:

  [0] CSS           — デザイントークン & コンポーネント
  [1] HTML SHELL    — レイアウト骨格（データなし）
  [2] CONFIG        — ★ 全データ・設定はここだけ修正
  [3] STATE         — シングル状態マネージャー（localStorage自動同期）
  [4] EVENTBUS      — ブロック間通信チャネル
  [5] UI CORE       — ルーター、トースト、モーダル
  [6] BLOCK: Planning  — 企画入力
  [7] BLOCK: Brief     — ブリーフ生成・レビュー・最終確定
  [8] BLOCK: Archive   — 素材アーカイブ
  [9] BLOCK: Settings  — 部署/メンバー/項目/API設定
  [10] BLOCK: API      — AI・Drive・Slack連携
  [11] INIT            — アプリブートストラップ
════════════════════════════════════════════════════════════════════════ -->

<style>
/* ══════════════════════════════════════════════════════════
   [0] CSS — デザイントークン & コンポーネント
   修正: CSS変数を変えるだけで全テーマ変更可能
══════════════════════════════════════════════════════════ */

/* — トークン — */
:root {
  --bg:        #07090F;
  --surface:   #0C1018;
  --card:      #111827;
  --border:    #1E2D3D;
  --blue:      #2563EB;
  --cyan:      #06B6D4;
  --emerald:   #10B981;
  --amber:     #F59E0B;
  --rose:      #F43F5E;
  --violet:    #8B5CF6;
  --orange:    #F97316;
  --text:      #F1F5F9;
  --muted:     #64748B;
  --dim:       #334155;
  --r:         8px;

  /* 組織カラー */
  --org-east:    #3B82F6;  /* East Publishing — 青 */
  --org-pubgm:   #F97316;  /* PUBG Mobile JP — オレンジ */
}

/* — リセット — */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* — レイアウト — */
.sidebar {
  width: 220px; min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
.brand-name { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
.brand-sub  { font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
.brand-ver  { display: inline-block; margin-top: 5px; padding: 2px 7px; background: rgba(6,182,212,.12); border: 1px solid rgba(6,182,212,.25); border-radius: 3px; font-size: 9px; color: var(--cyan); font-family: 'JetBrains Mono', monospace; }

.nav { flex: 1; padding: 6px 0; }
.nav-grp { padding: 12px 16px 3px; font-size: 9px; color: var(--muted); letter-spacing: 2px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 16px; cursor: pointer; font-size: 12px; color: var(--muted);
  transition: all .15s; border-left: 2px solid transparent; user-select: none;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,.025); }
.nav-item.active { color: var(--cyan); border-left-color: var(--cyan); background: rgba(6,182,212,.06); }
.nav-main { font-size: 12px; line-height: 1.3; }
.nav-sub  { font-size: 9px; color: var(--muted); opacity: .7; letter-spacing: .3px; }
.nav-item.active .nav-sub { color: var(--cyan); opacity: .6; }
.nav-ic { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }

.sidebar-foot { padding: 12px 16px; border-top: 1px solid var(--border); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); animation: pulse 2s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(16,185,129,.4);} 50%{opacity:.7;box-shadow:0 0 0 5px rgba(16,185,129,0);} }

.main { flex: 1; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
.topbar {
  background: rgba(7,9,15,.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  height: 52px; display: flex; align-items: center; padding: 0 22px; gap: 14px;
  position: sticky; top: 0; z-index: 100;
}
.topbar-title { font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
.breadcrumb { font-size: 11px; color: var(--muted); }
.breadcrumb span { color: var(--cyan); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.api-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px; border: 1px solid;
  font-size: 10px; cursor: pointer; transition: all .2s;
  font-family: 'JetBrains Mono', monospace;
}
.api-pill.live { border-color: rgba(16,185,129,.4); color: var(--emerald); background: rgba(16,185,129,.08); }
.api-pill.mock { border-color: rgba(245,158,11,.4); color: var(--amber); background: rgba(245,158,11,.08); }
.api-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.content { flex: 1; padding: 22px; overflow-y: auto; }

/* — ページ — */
.page { display: none; animation: fadeUp .25s ease; }
.page.active { display: block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

/* — ページヘッダー — */
.ph { margin-bottom: 20px; }
.ph-tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--cyan); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; }
.ph h1 { font-family: 'Noto Sans JP', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: -.2px; }
.ph p  { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* — カード — */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
.card + .card { margin-top: 12px; }
.card-hd { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; padding-bottom: 11px; border-bottom: 1px solid var(--border); }
.card-hd-ic { font-size: 15px; margin-top: 1px; }
.card-hd-title { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 700; }
.card-hd-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

/* — グリッド — */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* — フォーム — */
.fg { margin-bottom: 12px; }
.fl { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
.fl .req { color: var(--rose); }
.fl .jp  { font-size: 9px; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
input, select, textarea {
  width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 11px; color: var(--text);
  font-family: 'Noto Sans JP', sans-serif; font-size: 12px; outline: none;
  transition: border-color .15s, background .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--cyan); background: rgba(6,182,212,.04); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .5; }
select option { background: var(--card); }
textarea { resize: vertical; line-height: 1.6; }

/* — ボタン — */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 6px; font-family: 'Noto Sans JP', sans-serif;
  font-size: 12px; font-weight: 700; cursor: pointer; border: none; transition: all .18s;
}
.btn-cyan    { background: var(--cyan); color: #07090F; }
.btn-cyan:hover { background: #22D3EE; box-shadow: 0 0 16px rgba(6,182,212,.3); }
.btn-emerald { background: var(--emerald); color: #07090F; }
.btn-emerald:hover { background: #34D399; }
.btn-violet  { background: var(--violet); color: #fff; }
.btn-violet:hover { background: #A78BFA; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-outline:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-ghost   { background: transparent; color: var(--muted); padding: 5px 9px; }
.btn-ghost:hover { color: var(--text); }
.btn-rose    { background: rgba(244,63,94,.15); color: var(--rose); border: 1px solid rgba(244,63,94,.3); }
.btn-rose:hover { background: rgba(244,63,94,.25); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-sm { padding: 5px 10px; font-size: 10px; }
.btn-xs { padding: 3px 8px; font-size: 10px; }

/* — チップ — */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border);
  font-size: 11px; cursor: pointer; color: var(--muted); transition: all .15s; user-select: none;
}
.chip:hover { border-color: var(--cyan); color: var(--cyan); }
.chip.on { background: rgba(6,182,212,.1); border-color: var(--cyan); color: var(--cyan); }

/* — セクション区切り線 — */
.section-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
  color: var(--cyan); letter-spacing: 3px; text-transform: uppercase;
  margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(6,182,212,.15);
}

/* — 統計 — */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; position: relative; overflow: hidden; }
.stat::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.stat.c1::before { background: linear-gradient(90deg, var(--cyan), var(--blue)); }
.stat.c2::before { background: linear-gradient(90deg, var(--emerald), var(--cyan)); }
.stat.c3::before { background: linear-gradient(90deg, var(--amber), var(--orange)); }
.stat.c4::before { background: linear-gradient(90deg, var(--violet), var(--rose)); }
.stat-n { font-family: 'Noto Sans JP', sans-serif; font-size: 28px; font-weight: 900; line-height: 1; }
.stat-l { font-size: 9px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

/* — 部署カード — */
.dept-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.dept-org-block { }
.dept-org-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; padding: 3px 9px;
  border-radius: 4px; display: inline-block; margin-bottom: 7px;
}
.dept-org-label.blue   { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
.dept-org-label.orange { background: rgba(249,115,22,.15);  color: #fb923c; border: 1px solid rgba(249,115,22,.25); }
.dept-row { display: flex; flex-wrap: wrap; gap: 7px; }
.dept-card {
  padding: 9px 13px; border-radius: var(--r); cursor: pointer;
  transition: all .18s; min-width: 110px; text-align: center; border: 1.5px solid;
}
.dept-card.blue   { background: rgba(59,130,246,.05);  border-color: rgba(59,130,246,.2); }
.dept-card.blue:hover  { background: rgba(59,130,246,.1);  border-color: #3b82f6; }
.dept-card.blue.sel    { background: rgba(59,130,246,.15); border-color: #3b82f6; box-shadow: 0 0 10px rgba(59,130,246,.2); }
.dept-card.orange { background: rgba(249,115,22,.05);  border-color: rgba(249,115,22,.2); }
.dept-card.orange:hover{ background: rgba(249,115,22,.1);  border-color: #f97316; }
.dept-card.orange.sel  { background: rgba(249,115,22,.15); border-color: #f97316; box-shadow: 0 0 10px rgba(249,115,22,.2); }
.dc-name { font-size: 11px; font-weight: 700; color: var(--text); }
.dc-sub  { font-size: 9px; color: var(--muted); margin-top: 2px; }

/* — 優先度スター — */
.priority-wrap { display: flex; align-items: center; gap: 5px; }
.pstar { font-size: 24px; color: var(--border); cursor: pointer; transition: all .15s; user-select: none; }
.pstar:hover { color: var(--amber); transform: scale(1.1); }
.pstar.on { color: var(--amber); text-shadow: 0 0 8px rgba(245,158,11,.5); }
.plabel { font-size: 10px; color: var(--muted); margin-left: 5px; }

/* — フローバー — */
.flowbar { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 18px; }
.fb-step { flex: 1; padding: 10px 8px; text-align: center; cursor: pointer; transition: background .18s; position: relative; }
.fb-step:not(:last-child)::after { content: '›'; position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--dim); }
.fb-step.active { background: rgba(6,182,212,.08); border-bottom: 2px solid var(--cyan); }
.fb-step.done   { background: rgba(16,185,129,.05); border-bottom: 2px solid var(--emerald); }
.fb-num { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); margin-bottom: 2px; }
.fb-label { font-size: 11px; font-weight: 700; color: var(--muted); }
.fb-step.active .fb-label, .fb-step.active .fb-num { color: var(--cyan); }
.fb-step.done .fb-label, .fb-step.done .fb-num { color: var(--emerald); }

/* — ブリーフタイプタブ — */
.type-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.type-tab {
  background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r);
  padding: 18px 22px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: all .18s;
}
.type-tab:hover { border-color: var(--cyan); }
.type-tab.active { border-color: var(--cyan); background: rgba(6,182,212,.07); }
.type-tab-ic { font-size: 28px; flex-shrink: 0; }
.type-tab-label { font-size: 32px; font-weight: 900; color: var(--muted); line-height: 1; letter-spacing: -.5px; font-family: 'Noto Sans JP', sans-serif; }
.type-tab-label span { display: none; }
.type-tab.active .type-tab-label { color: var(--text); }

/* — ブリーフグループラベル — */
.bg-label {
  font-size: 9px; font-weight: 700; color: var(--cyan); letter-spacing: 1.5px;
  text-transform: uppercase; margin: 14px 0 7px; padding-bottom: 5px;
  border-bottom: 1px solid rgba(6,182,212,.15); display: flex; align-items: center; gap: 5px;
}

/* — サイズチェックボックスグリッド — */
.size-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; }
.size-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 9px;
  background: rgba(255,255,255,.03); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; transition: all .15s; font-size: 11px; color: var(--muted);
}
.size-item:hover { border-color: var(--cyan); color: var(--text); }
.size-item input { width: 13px; height: 13px; flex-shrink: 0; accent-color: var(--cyan); }
.size-item:has(input:checked) { border-color: var(--cyan); background: rgba(6,182,212,.07); }
.size-dim { display: block; font-size: 9px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }

/* — レファレンス画像 — */
.ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 7px; margin-top: 6px; }
.ref-img-item { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; position: relative; }
.ref-img-item img { width: 100%; height: 80px; object-fit: cover; display: block; }
.ref-img-del {
  position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6);
  border: none; cursor: pointer; color: #fff; font-size: 11px;
  padding: 2px 5px; border-radius: 3px;
}
.ref-img-desc textarea { font-size: 9px; padding: 4px 6px; border-radius: 0; border: 0; border-top: 1px solid var(--border); height: 40px; min-height: 40px; }
.ref-upload-btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px;
  border: 1px dashed var(--border); border-radius: 6px; cursor: pointer;
  font-size: 10px; color: var(--muted); transition: all .15s; margin-top: 6px;
}
.ref-upload-btn:hover { border-color: var(--cyan); color: var(--cyan); }

/* — ブリーフ出力 — */
.brief-out { background: rgba(6,182,212,.04); border: 1px solid rgba(6,182,212,.18); border-radius: var(--r); padding: 18px; display: none; }
.brief-out.show { display: block; animation: fadeUp .3s ease; }
.bs { margin-bottom: 12px; }
.bs-title { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--cyan); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.bs-title::after { content: ''; flex: 1; height: 1px; background: rgba(6,182,212,.12); }
.bs-body { font-size: 12px; color: var(--text); line-height: 1.8; white-space: pre-wrap; }
.bs-body-jp { font-size: 11px; color: #94A3B8; margin-top: 4px; line-height: 1.7; }
.bkw { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin: 2px; background: rgba(255,255,255,.04); border: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }

/* — プレビュードキュメント — */
.preview-doc {
  background: #fff; border-radius: 10px; padding: 32px 36px;
  border: 1px solid var(--border); color: #1a1a1a;
  font-family: 'Noto Sans JP', sans-serif; box-shadow: 0 8px 40px rgba(0,0,0,.3);
  position: relative; overflow: hidden;
}
.preview-doc::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #06B6D4, #2563EB); }
.pv-title { font-family: 'Noto Sans JP', sans-serif; font-size: 18px; font-weight: 900; color: #0D1825; margin-bottom: 14px; letter-spacing: -.2px; }
.pv-meta-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 8px; margin-bottom: 16px; }
.pv-meta-item { padding: 7px 9px; background: #F8FAFC; border-radius: 5px; border: 1px solid #E2E8F0; }
.pv-label { display: block; font-size: 8px; color: #94A3B8; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
.pv-val   { display: block; font-size: 11px; color: #1E293B; font-weight: 600; }
.pv-divider { height: 1px; background: #E2E8F0; margin: 14px 0; }
.pv-section { margin-bottom: 14px; }
.pv-section-title { font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #06B6D4; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
.pv-section-title::after { content: ''; flex: 1; height: 1px; background: #E0F7FA; }
.pv-section-body { font-size: 11px; color: #334155; line-height: 1.8; white-space: pre-wrap; }
.pv-kw { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 9px; margin: 2px; background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; font-weight: 600; }
.pv-status { padding: 2px 9px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
.pv-status.draft { background: #FEF3C7; color: #B45309; }
.pv-status.fixed { background: #D1FAE5; color: #065F46; }

/* — 共有カード — */
.share-grid { display: grid; gap: 10px; margin-top: 14px; }
.share-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px; text-align: center; cursor: pointer; transition: all .18s; position: relative;
}
.share-card:hover { border-color: var(--cyan); background: rgba(6,182,212,.04); transform: translateY(-1px); }
.share-icon { font-size: 22px; margin-bottom: 5px; }
.share-label { font-size: 10px; color: var(--muted); line-height: 1.4; }
.share-label span { display: block; font-size: 9px; color: var(--dim); }

/* — アーカイブ — */
.arch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 10px; }
.arch-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; cursor: pointer; transition: all .2s; }
.arch-item:hover { border-color: var(--cyan); transform: translateY(-2px); }
.arch-thumb { height: 90px; display: flex; align-items: center; justify-content: center; font-size: 28px; position: relative; }
.arch-badge { position: absolute; top: 6px; right: 6px; font-size: 8px; padding: 2px 5px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.arch-info { padding: 9px; }
.arch-name { font-size: 11px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.arch-meta { font-size: 9px; color: var(--muted); }
.arch-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.arch-tag  { font-size: 8px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.04); color: var(--muted); }
.filter-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }
.fbtn { padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border); font-size: 10px; cursor: pointer; color: var(--muted); background: transparent; transition: all .15s; }
.fbtn.on { background: rgba(6,182,212,.1); border-color: var(--cyan); color: var(--cyan); }
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap input { padding-left: 34px; }
.search-ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }

/* — 設定タブ — */
.st-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 18px; }
.st-tab { flex: 1; padding: 7px 12px; border-radius: 5px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; color: var(--muted); transition: all .15s; border: none; background: transparent; font-family: 'Noto Sans JP', sans-serif; }
.st-tab:hover { color: var(--text); }
.st-tab.active { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.st-panel { display: none; }
.st-panel.active { display: block; }

/* — 設定：チームカード — */
.team-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 5px; overflow: hidden; }
.team-card.blue   { border-left: 3px solid rgba(59,130,246,.5); }
.team-card.orange { border-left: 3px solid rgba(249,115,22,.5); }
.team-header { display: flex; align-items: center; gap: 9px; padding: 9px 12px; cursor: pointer; user-select: none; transition: background .15s; }
.team-header:hover { background: rgba(255,255,255,.02); }
.team-name  { flex: 1; font-size: 12px; font-weight: 700; color: var(--text); }
.team-count { font-size: 10px; color: var(--muted); }
.team-toggle { font-size: 11px; color: var(--muted); transition: transform .2s; }
.team-toggle.open { transform: rotate(180deg); }
.team-del { background: rgba(244,63,94,.1); color: var(--rose); border: 1px solid rgba(244,63,94,.25); border-radius: 4px; font-size: 9px; padding: 2px 7px; cursor: pointer; transition: all .15s; }
.team-del:hover { background: rgba(244,63,94,.2); }
.member-panel { padding: 0 12px 10px; border-top: 1px solid var(--border); background: rgba(255,255,255,.01); }
.member-list  { padding: 5px 0; }
.member-row   { display: flex; align-items: center; gap: 7px; padding: 4px 5px; border-radius: 5px; font-size: 11px; transition: background .12s; }
.member-row:hover { background: rgba(255,255,255,.04); }
.member-name  { flex: 1; color: var(--text); }
.member-del   { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 11px; padding: 2px 4px; border-radius: 3px; transition: all .12s; }
.member-del:hover { background: rgba(244,63,94,.15); color: var(--rose); }
.member-add-row { display: flex; gap: 6px; margin-top: 5px; }

/* — フィールドビルダー — */
.field-builder { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.fb-row { display: flex; align-items: center; gap: 7px; padding: 7px 9px; background: var(--card); border: 1px solid var(--border); border-radius: 5px; margin-bottom: 5px; font-size: 11px; }
.fb-drag { color: var(--muted); cursor: grab; font-size: 13px; }
.fb-type { font-family: 'JetBrains Mono', monospace; font-size: 8px; padding: 2px 5px; border-radius: 3px; background: rgba(6,182,212,.08); color: var(--cyan); }
.fb-add-btn { display: flex; align-items: center; gap: 5px; padding: 7px 10px; border: 1px dashed var(--border); border-radius: 5px; cursor: pointer; font-size: 11px; color: var(--muted); transition: all .15s; margin-top: 6px; }
.fb-add-btn:hover { border-color: var(--cyan); color: var(--cyan); }

/* — Drive — */
.drive-status-bar { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 7px; border: 1px solid; font-size: 11px; margin-bottom: 12px; transition: all .3s; }
.drive-status-bar.disconnected { border-color: var(--border); background: rgba(255,255,255,.02); color: var(--muted); }
.drive-status-bar.connected { border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.06); color: var(--emerald); }
.drive-status-ic { font-size: 17px; flex-shrink: 0; }
.drive-status-title { font-weight: 700; font-size: 11px; }
.drive-status-sub { font-size: 9px; opacity: .7; margin-top: 1px; }
.drive-file-list { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-top: 8px; }
.drive-file-header { padding: 7px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; }
.drive-file-header input { flex: 1; font-size: 10px; padding: 4px 7px; }
.drive-file-item { display: flex; align-items: center; gap: 9px; padding: 7px 12px; border-bottom: 1px solid rgba(30,45,61,.5); cursor: pointer; transition: background .12s; font-size: 11px; }
.drive-file-item:last-child { border-bottom: none; }
.drive-file-item:hover { background: rgba(6,182,212,.04); }
.drive-file-name { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drive-file-meta { font-size: 9px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
.drive-folder-path { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); flex-wrap: wrap; }
.drive-crumb { cursor: pointer; color: var(--cyan); transition: opacity .12s; }
.drive-crumb:hover { opacity: .7; }

/* — Slackプレビュー — */
.slack-preview { background: #1A1D21; border: 1px solid #2B2D31; border-radius: 7px; padding: 12px; font-size: 11px; margin-top: 10px; }
.slack-bar { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #2B2D31; }
.slack-app-ic { width: 26px; height: 26px; background: linear-gradient(135deg, #4A154B, #6C1D6C); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.slack-sender { font-weight: 700; color: #D1D2D3; font-size: 12px; }
.slack-body { color: #D1D2D3; line-height: 1.6; }
.slack-att { margin-top: 7px; padding: 7px 9px; border-left: 3px solid var(--cyan); background: rgba(255,255,255,.03); border-radius: 0 4px 4px 0; }
.slack-att-title { font-weight: 700; color: var(--cyan); font-size: 11px; margin-bottom: 3px; }
.slack-att-body { font-size: 9px; color: #949BA4; line-height: 1.6; }

/* — ローディング — */
.loading { display: none; align-items: center; gap: 9px; padding: 10px 14px; background: rgba(6,182,212,.05); border: 1px solid rgba(6,182,212,.18); border-radius: 6px; font-size: 11px; color: var(--cyan); margin-bottom: 10px; }
.loading.show { display: flex; }
.spinner { width: 14px; height: 14px; border: 2px solid rgba(6,182,212,.2); border-top-color: var(--cyan); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
@keyframes spin { to{ transform: rotate(360deg); } }

/* — ピル — */
.pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 20px; font-size: 9px; font-weight: 700; }
.p-cyan    { background: rgba(6,182,212,.12);  color: var(--cyan);    border: 1px solid rgba(6,182,212,.25); }
.p-emerald { background: rgba(16,185,129,.12); color: var(--emerald); border: 1px solid rgba(16,185,129,.25); }
.p-amber   { background: rgba(245,158,11,.12); color: var(--amber);   border: 1px solid rgba(245,158,11,.25); }
.p-rose    { background: rgba(244,63,94,.12);  color: var(--rose);    border: 1px solid rgba(244,63,94,.25); }
.p-violet  { background: rgba(139,92,246,.12); color: var(--violet);  border: 1px solid rgba(139,92,246,.25); }


/* — 言語切り替えボタン — */
.lang-switcher {
  display: flex; align-items: center; gap: 2px;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px; margin-right: 6px;
}
.lang-btn {
  padding: 3px 10px; border-radius: 4px; font-size: 10px; font-weight: 700;
  cursor: pointer; border: none; background: transparent;
  color: var(--muted); font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px; transition: all .15s;
}
.lang-btn:hover { color: var(--text); }
.lang-btn.active {
  background: var(--cyan); color: #07090F;
  box-shadow: 0 0 8px rgba(6,182,212,.3);

/* — トースト — */
.toast {
  position: fixed; bottom: 22px; right: 22px; background: var(--card);
  border: 1px solid var(--border); border-radius: 7px; padding: 10px 16px;
  font-size: 11px; color: var(--text); z-index: 2000;
  transform: translateY(60px); opacity: 0; transition: all .25s;
  display: flex; align-items: center; gap: 7px; max-width: 320px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok  { border-color: rgba(16,185,129,.4); }
.toast.err { border-color: rgba(244,63,94,.4); }
.toast.info{ border-color: rgba(6,182,212,.4); }

/* — モーダル — */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(6px); z-index: 1000; display: none; align-items: center; justify-content: center; }
.overlay.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 440px; max-width: 92vw; }

.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  try { lang = (typeof STATE !== 'undefined' ? STATE.get('lang') : null) || 'JP'; } catch(e) {}
  let str = (LANG[lang] || LANG.JP)[key] || LANG.JP[key] || key;
  if (vars) Object.keys(vars).forEach(k => { str = str.replace('{'+k+'}', vars[k]); });
  return str;
}




/* ════════════════════════════════════════════════════════════════════════
   [3] STATE — シングル状態マネージャー
   全ランタイム状態はここに。自動でlocalStorage同期。
   [FIX 1] 機密情報(apiKey, webhook, driveToken)はsessionStorageへ分離
           → ブラウザ終了時に自動削除、XSS被害範囲を最小化
════════════════════════════════════════════════════════════════════════ */
const STATE = (() => {
  /* 기본값 */
  const DEFAULTS = {
    /* API */
    lang: 'JP',
    apiKey:   '', provider: 'claude', model: 'claude-sonnet-4-6',
    webhook:  '',
    /* 기획 */
    dept: '', priority: 0,
    /* 브리프 */
    lastBrief: null, lastProjName: '', lastBriefType: 'visual', lastIP: '', lastOwner: '',
    briefHistory: [],
    lastBriefRefs:  [],
    lastStoryboard: [],
    /* 통계 */
    visualCount: 0, videoCount: 0, slackSent: 0,
    /* 조직 (CONFIG.ORGS 기반 + 사용자 편집) */
    orgs: null,
    /* 아카이브 필터 */
    archFilter: 'all',
    /* Drive */
    driveClientId: '', driveFolderId: '', driveToken: '',
  };

  /* 機密キー一覧 — sessionStorage使用（ブラウザ終了時に自動削除） */
  const SESSION_KEYS = new Set(['driveToken']); /* driveTokenのみsessionStorage、他はlocalStorage */
  /* 大容量データ（Base64画像等）はlocalStorage非保存 — メモリのみで保持 */
  const MEMORY_ONLY_KEYS = new Set(['lastBriefRefs', 'lastStoryboard']);

  /* キーに合うstorageを返す */
  function _store(key) { return SESSION_KEYS.has(key) ? sessionStorage : MEMORY_ONLY_KEYS.has(key) ? null : localStorage; }

  /* ストレージから復元 */
  function load() {
    const saved = {};
    Object.keys(DEFAULTS).forEach(k => {
      const store = _store(k);
      if (!store) return;  /* MEMORY_ONLY_KEYS: localStorage非保存、スキップ */
      const v = store.getItem('ach3_' + k);
      if (v !== null) {
        try { saved[k] = JSON.parse(v); }
        catch { saved[k] = v; }
      }
    });
    return Object.assign({}, DEFAULTS, saved);
  }

  const _s = load();

  /* 組織データ初期化（なければCONFIGから） */
  if (!_s.orgs) _s.orgs = JSON.parse(JSON.stringify(CONFIG.ORGS));

  function get(key)       { return _s[key]; }
  function set(key, val)  {
    _s[key] = val;
    const store = _store(key);
    if (store) { try { store.setItem('ach3_' + key, JSON.stringify(val)); } catch(e) {} }
  }
  function update(patches) { Object.keys(patches).forEach(k => set(k, patches[k])); }
  function reset(key)      { set(key, DEFAULTS[key]); }

  return { get, set, update, reset, raw: _s };
})();


/* ════════════════════════════════════════════════════════════════════════
   [4] EVENTBUS — ブロック間通信チャネル
   使用: BUS.on('dept:changed', handler)  BUS.emit('dept:changed', data)
   ブロック同士は直接呼び出さずイベントのみで通信 → 結合度ゼロ
════════════════════════════════════════════════════════════════════════ */
const BUS = (() => {
  const _handlers = {};
  function on(event, fn)   { (_handlers[event] = _handlers[event] || []).push(fn); }
  function off(event, fn)  { if (_handlers[event]) _handlers[event] = _handlers[event].filter(h => h !== fn); }
  function emit(event, data) { (_handlers[event] || []).forEach(h => h(data)); }
  return { on, off, emit };
})();


/* ════════════════════════════════════════════════════════════════════════
   [5] UI CORE — ルーター、トースト、モーダル、共通レンダーユーティリティ
════════════════════════════════════════════════════════════════════════ */
const UI = (() => {
  /* ルーター */
  function go(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const page = document.getElementById('page-' + pageId);
    if (page) page.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => {
      if (n.dataset.page === pageId) n.classList.add('active');
    });
    const nav = CONFIG.NAV.find(n => n.id === pageId); const label = nav ? (L('nav_'+pageId) || nav.label) : pageId;
    document.getElementById('breadcrumb').innerHTML = '<span>' + label + '</span>';
    BUS.emit('page:changed', { page: pageId });
  }

  /* サイドバーレンダー */
  function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = CONFIG.NAV.map(item => {
      if (item.group) return '<div class="nav-grp">' + item.group + '</div>';
      const sub = L('nav_'+item.id+'_sub');
      return '<div class="nav-item" data-page="' + item.id + '" onclick="UI.go(\'' + item.id + '\')">'
           + '<span class="nav-ic">' + item.icon + '</span>'
           + '<span class="nav-main">' + (L('nav_'+item.id) || item.label)
           + (sub && sub !== 'nav_'+item.id+'_sub' ? '<div class="nav-sub">' + sub + '</div>' : '')
           + '</span></div>';
    }).join('');
  }

  /* トースト */
  function toast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.className = 'toast ' + type;
    el.innerHTML = (type==='ok'?'✓ ': type==='err'?'✕ ':'ℹ ') + msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 3000);
  }

  /* モーダル */
  function modal(id, show) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('show', show);
  }

  /* API状態UI更新 */
  function updateApiUI() {
    const key  = STATE.get('apiKey');
    const prov = STATE.get('provider');
    const live = key && key.length > 10;
    const pill = document.getElementById('apiPill');
    if (pill) {
      pill.className = 'api-pill ' + (live ? 'live' : 'mock');
      document.getElementById('apiPillLabel').textContent = live ? L('pill_live', {prov:prov.toUpperCase()}) : L('pill_mock');
    }
    const sideStatus = document.getElementById('sideStatus');
    if (sideStatus) sideStatus.textContent = live ? L('status_live', {prov:prov.toUpperCase()}) : L('status_mock');
  }

  /* 공통 사이즈 체크박스 렌더 (Visual·Video 공용) */
  function renderSizes(containerId, otherId) {
    const c = document.getElementById(containerId);
    if (!c) return;
    c.innerHTML = CONFIG.SIZES.map(s =>
      '<label class="size-item"><input type="checkbox" value="' + s.value + '">'
    + '<span>' + s.label + '<span class="size-dim">' + s.dim + '</span></span></label>'
    ).join('');
  }

  /* 칩 토글 */
  function tc(el) { el.classList.toggle('on'); }

  /* sleep */
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }


  /* 言語切り替え */
  function setLang(lang) {
    if (lang !== 'JP' && lang !== 'KR') return;
    STATE.set('lang', lang);
    /* ボタン状態更新 */
    document.getElementById('langBtnJP')?.classList.toggle('active', lang === 'JP');
    document.getElementById('langBtnKR')?.classList.toggle('active', lang === 'KR');
    /* 全ブロック再レンダー */
    const currentPage = document.querySelector('.page.active')?.id?.replace('page-','') || 'planning';
    BLOCK.Planning.render();
    BLOCK.Brief.render();
    BLOCK.Archive.render();
    BLOCK.Settings.render();
    go(currentPage);
    updateApiUI();
    /* APIモーダルテキスト更新 */
    const mh = document.querySelector('#apiModal h3');
    const mp = document.querySelector('#apiModal p');
    const mb1 = document.querySelector('#apiModal .btn-outline');
    const mb2 = document.querySelector('#apiModal .btn-cyan');
    if (mh)  mh.textContent  = L('modal_title');
    if (mp)  mp.innerHTML    = L('modal_desc');
    if (mb1) mb1.textContent = L('btn_mock_cont');
    if (mb2) mb2.textContent = L('btn_activate');
    /* breadcrumb */
    const bc = document.getElementById('breadcrumb');
    if (bc) { const nav = CONFIG.NAV.find(n => n.id === currentPage); if(nav) bc.innerHTML = '<span>' + L('nav_'+currentPage) + '</span>'; }
  }

  return { go, renderNav, toast, modal, updateApiUI, renderSizes, tc, sleep, setLang };
})();

  function renderHistory(filterArr) {

    const starColors = { 1:'#6EE7B7', 2:'#FCD34D', 3:'#FDA4AF' };

    const orgs = STATE.get('orgs') || CONFIG.ORGS;
    const deptColorMap = {};
    orgs.forEach(org => org.teams.forEach(t => { deptColorMap[t.id] = org.color; }));

    tbody.innerHTML = briefs.map((b, idx) => {
      const stars = b.priority ? '★'.repeat(b.priority)+'☆'.repeat(3-b.priority) : '—';

      const typeLabel = b.type === 'visual' ? 'Visual' : 'Movie';
      const deptC = deptColorMap[b.dept];
      const deptStyle = deptC === 'orange' ? 'color:var(--orange);' : deptC === 'blue' ? 'color:var(--blue);' : 'color:var(--muted);';
      const deptLabel = b.deptLabel || b.dept || '—';
      const realIdx = STATE.get('briefHistory').indexOf(b);
      return '<tr style="cursor:pointer;" onclick="BLOCK.Planning.loadFromHistory(' + realIdx + ')">'
        + '<td style="font-size:10px;color:var(--cyan);">' + (b.ip||'—') + '</td>'
        + '<td style="font-weight:700;">' + (b.name||'—') + '</td>'
        + '<td style="color:' + typeColor + ';font-weight:700;font-size:10px;">' + typeLabel + '</td>'
        + '<td style="' + deptStyle + 'font-size:10px;">' + deptLabel + '</td>'
        + '<td style="color:var(--muted);font-size:10px;">' + (b.owner||'—') + '</td>'
        + '<td style="color:' + (starColors[b.priority]||'var(--muted)') + '">' + stars + '</td>'
        + '<td style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:var(--muted)">' + b.date + '</td>'
        + '<td><span class="pill p-amber" style="font-size:9px;">' + b.status + '</span></td>'
        + '<td><button class="btn-ghost" style="font-size:11px;color:var(--muted);cursor:pointer;background:none;border:none;padding:2px 5px;" onclick="event.stopPropagation();BLOCK.Planning.deleteHistory(' + realIdx + ')">✕</button></td>'
        + '</tr>';

  function setHistFilter(el, f) {
    document.querySelectorAll('#hist-filters .fbtn').forEach(b => b.classList.remove('on'));
    el.classList.add('on');

  function filterHistory() {
    const q = (document.getElementById('hist-q')?.value || '').toLowerCase();
    const briefs = STATE.get('briefHistory');
    const filtered = briefs.filter(b => {
      const matchFilter = _histFilter === 'all' || b.type === _histFilter;
      const matchQ = !q || (b.name||'').toLowerCase().includes(q) || (b.owner||'').toLowerCase().includes(q) || (b.ip||'').toLowerCase().includes(q) || (b.date||'').includes(q);
      return matchFilter && matchQ;
    });
    renderHistory(filtered);

  function loadFromHistory(idx) {
    const briefs = STATE.get('briefHistory');
    const b = briefs[idx];
    if (!b) return;
    /* 기획 폼에 반영 */
    const fill = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
    fill('p-title', b.ip || '');
    fill('p-name', b.name || '');
    if (b.dept) { STATE.set('dept', b.dept); const card = document.querySelector('.dept-card[onclick*="' + b.dept + '"]'); if (card) { document.querySelectorAll('.dept-card').forEach(c => c.classList.remove('sel')); card.classList.add('sel'); } updateOwnerDropdown(b.dept); }
    fill('p-owner', b.owner || '');
    if (b.priority) setPriority(b.priority);
    STATE.update({ lastIP: b.ip || '', lastProjName: b.name || '', lastOwner: b.owner || '', lastBriefType: b.type || 'visual' });
    UI.toast(L('hist_load_ok'), 'ok');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function deleteHistory(idx) {
    if (!confirm(L('hist_del_confirm'))) return;
    const briefs = JSON.parse(JSON.stringify(STATE.get('briefHistory')));
    briefs.splice(idx, 1);
    STATE.set('briefHistory', briefs);
    renderHistory();
    updateStats();
    UI.toast(L('hist_del_ok'), 'ok');
  }

  function updateStats() {
    const ids = { 's-briefs': STATE.get('briefHistory').length, 's-visual': STATE.get('visualCount'), 's-video': STATE.get('videoCount'), 's-slack': STATE.get('slackSent') };
    Object.entries(ids).forEach(([id, val]) => { const el = document.getElementById(id); if(el) el.textContent = val; });
  }

  /* BUS 구독: 브리프 저장 시 히스토리 업데이트 */
  BUS.on('brief:saved', () => { renderHistory(); updateStats(); });
  BUS.on('brief:stat', () => updateStats());

  return { render, selDept, updateOwnerDropdown, setPriority, selectBudget, goToBrief, clear, renderHistory, updateStats, setHistFilter, filterHistory, loadFromHistory, deleteHistory };
})();

  /* タイプ切り替え */
  function switchType(type) {
    currentType = type;

    ['visual','video'].forEach(t => {
      document.getElementById('tab-' + t)?.classList.toggle('active', t === type);
      document.getElementById('panel-' + t).style.display = t === type ? 'block' : 'none';
    });
    /* 出力初期化 */
    ['v-out','vid-out'].forEach(id => { const el = document.getElementById(id); if(el){el.classList.remove('show'); el.innerHTML='';} });
    ['v-placeholder','vid-placeholder'].forEach(id => { const el = document.getElementById(id); if(el) el.style.display='block'; });
    ['v-review-btn','vid-review-btn'].forEach(id => { const el = document.getElementById(id); if(el) el.style.display='none'; });
  }

  /* 値読み取りヘルパー */
  function gv(id) { const el = document.getElementById(id); return el ? el.value : ''; }
  /* ブリーフファイル名生成: YYMMDD_IP_PJ名_V(Visual) or M(Movie) */
  function getBriefFileName() {
    const d = new Date();
    const yy = String(d.getFullYear()).slice(2);
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const dateStr = yy + mm + dd;
    const san = s => String(s||'').replace(/[/\\?:*"<>|\s　]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
    const ip   = san(STATE.get('lastIP') || gv('p-title') || 'IP');
    const proj = san(STATE.get('lastProjName') || 'PJ');
    const isVis = STATE.get('lastBriefType') === 'visual';
    const anken = san(isVis ? gv('v-title') : gv('vid-title'));
    const suffix = isVis ? 'V' : 'M';
    const owner = san(STATE.get('lastOwner') || gv('p-owner'));
    const parts = [dateStr, ip, proj, anken, suffix, owner].filter(Boolean);
    return parts.join('_');
  }

  function getCheckedSizes(prefix) {
    return Array.from(document.querySelectorAll('#'+prefix+' input[type=checkbox]:checked')).map(c=>c.value).join(', ');
  }
  function getChips(scope) {
    return Array.from(document.querySelectorAll('#'+scope+' .chip.on')).map(c=>c.textContent.trim()).join(', ');
  }

  /* レファレンス画像収集 — { idx, src(base64), desc } 配列返却 */
  function getRefImages(gridId) {
    const grid = document.getElementById(gridId);
    if (!grid) return [];
    return Array.from(grid.querySelectorAll('.ref-img-item')).map((item, idx) => ({
      idx: idx + 1,
      src:  item.querySelector('img')?.src || '',
      desc: item.querySelector('textarea')?.value.trim() || '',
    }));
  }

  /* レファレンス画像 → AIプロンプト用テキスト */
  function refToPromptText(refs) {
    if (!refs.length) return 'なし';
    return refs.map(r => '[レファレンス' + r.idx + '] ' + (r.desc || '説明なし')).join(' / ');
  }

  /* レファレンス画像 → ブリーフ/ドキュメントレンダーHTML
     isDark: true=ダーク背景（ブリーフ出力）, false=ホワイト背景（Preview Doc） */
  function refToHtml(refs, isDark) {
    if (!refs.length) return '';
    return refs.map(r =>
      '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;">'
      + '<img src="' + r.src + '" alt="ref' + r.idx + '" style="width:80px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0;border:1px solid ' + (isDark ? 'rgba(255,255,255,.1)' : '#E2E8F0') + ';">'
      + (r.desc ? '<span style="font-size:10px;color:' + (isDark ? '#94A3B8' : '#64748B') + ';line-height:1.5;padding-top:2px;">' + r.desc + '</span>' : '')
      + '</div>'
    ).join('');
  }


  function _sbCutNum(n){return L('sb_cut_label')+String(n).padStart(2,'0');}
  function _sbRenumber(id){const c=document.getElementById(id);if(!c)return;c.querySelectorAll('.sb-cut-item').forEach((item,idx)=>{const el=item.querySelector('.sb-cut-num');if(el)el.textContent=_sbCutNum(idx+1);});}
  function sbAddCut(containerId){
    const container=document.getElementById(containerId);if(!container)return;
    const hint=container.querySelector('.sb-empty-hint');if(hint)hint.remove();
    const cutIdx=container.querySelectorAll('.sb-cut-item').length+1;

  function sbImgUpload(input){
    const file=input.files[0];if(!file||!file.type.startsWith('image/'))return;
    const wrap=input.closest('.sb-cut-img-wrap'),MAX=800;
    const reader=new FileReader();
    reader.onload=function(e){const img=new Image();img.onload=function(){
      const canvas=document.createElement('canvas');let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
      const src=canvas.toDataURL('image/jpeg',0.8);
      wrap.innerHTML='<img src="'+src+'" alt="cut" data-w="'+w+'" data-h="'+h+'"><button class="sb-cut-img-del" onclick="BLOCK.Brief.sbImgDel(this)">✕</button>';
    };img.src=e.target.result;};reader.readAsDataURL(file);
  }

  function sbGetCuts(containerId){
    const c=document.getElementById(containerId);if(!c)return[];

      const imgEl=item.querySelector('img'),timeEl=item.querySelector('.sb-cut-time'),descEl=item.querySelector('.sb-cut-desc');
      return{num:idx+1,time:timeEl?timeEl.value.trim():'',desc:descEl?descEl.value.trim():'',src:imgEl?imgEl.src:'',w:parseInt((imgEl&&imgEl.dataset.w)||0)||0,h:parseInt((imgEl&&imgEl.dataset.h)||0)||0};
    });

  /* 이미지 업로드 */
  /* レファレンス画像アップロード（OOM防止: Canvas 800pxリサイズ + JPEG80%圧縮）*/
  function uploadRef(input, gridId) {
    const grid = document.getElementById(gridId);
    if (!grid) return;
    const MAX_SIZE = 800;
    Array.from(input.files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > MAX_SIZE || h > MAX_SIZE) {
            if (w > h) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
            else       { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const src = canvas.toDataURL('image/jpeg', 0.8);
          const item = document.createElement('div');
          item.className = 'ref-img-item';
          item.innerHTML = '<img src="' + src + '" alt="ref" data-w="' + w + '" data-h="' + h + '">'
            + '<button class="ref-img-del" onclick="this.closest(\'.ref-img-item\').remove()">✕</button>'
            + '<div><textarea placeholder="' + L('img_desc_ph') + '"></textarea></div>';
          grid.appendChild(item);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
    input.value = '';
  }

  /* AI生成メイン */
  async function generate(type) {
    const projName = gv('p-name') || L('mock_new_camp');
    const gameTitle = gv('p-title') || 'PUBG Mobile';
    const goals = getChips('goal-chips');
    const btnId = type === 'visual' ? 'v-gen-btn' : 'vid-gen-btn';
    const loadId = type === 'visual' ? 'v-loading' : 'vid-loading';
    const phId   = type === 'visual' ? 'v-placeholder' : 'vid-placeholder';
    const outId  = type === 'visual' ? 'v-out' : 'vid-out';
    const revId  = type === 'visual' ? 'v-review-btn' : 'vid-review-btn';

    const btn  = document.getElementById(btnId);
    const load = document.getElementById(loadId);
    const ph   = document.getElementById(phId);
    const out  = document.getElementById(outId);

    ph.style.display = 'none';
    out.classList.remove('show');
    load.classList.add('show');
    if (btn) btn.disabled = true;

    /* プロンプトデータ収集 */
    let msg = '';
    let refs = [];
    if (type === 'visual') {
      const sizes = [getCheckedSizes('vis-size-grid'), gv('v-size-other')].filter(Boolean).join(', ');
      msg = 'タイトル:' + gv('v-title') + ' / サイズ:' + sizes + ' / 方向性:' + gv('v-direction') + ' / 文言:' + gv('v-detail');
      refs = getRefImages('vis-ref-grid');
    } else {
      msg = '訴求:' + gv('vid-appeal') + ' / 内容:' + gv('vid-content').slice(0,100) + ' / ターゲット:' + gv('vid-target');
      refs = getRefImages('vid-ref-grid');
    }

    /* レファレンス画像STATE保存（renderBriefOut/buildPreviewHTMLで使用）*/
    STATE.set('lastBriefRefs', refs);
    /* ストーリーボードはAI呼び出し直前に保存（最新状態を確実に取得）*/
    if (type !== 'visual') {
      STATE.set('lastStoryboard', sbGetCuts('vid-sb-container'));
    }

    let brief;
    const key = STATE.get('apiKey');
    if (key && key.length > 10) {
      const loadTextEl = document.getElementById('v-loading-text');
      if (loadTextEl) loadTextEl.textContent = L('gen_loading_api', {prov: STATE.get('provider').toUpperCase()});
      /* レファレンス説明テキストをプロンプトに含める */
      brief = await BLOCK.API.callAI(projName, gameTitle, type, msg, goals, refToPromptText(refs));
      /* [FIX 3] API失敗時にnull返却 → ローディング解除後中断（Mockフォールバックなし） */
      if (!brief) {
        load.classList.remove('show');
        if (btn) btn.disabled = false;
        ph.style.display = 'block';
        return;
      }
    } else {
      await UI.sleep(1200);
      brief = BLOCK.API.mockBrief(projName, gameTitle, type, goals);
    }

    load.classList.remove('show');
    if (btn) btn.disabled = false;

    const briefIP = type === 'visual' ? gv('v-ip') : gv('vid-ip');
    STATE.update({ lastBrief: brief, lastProjName: projName, lastBriefType: type, lastIP: briefIP || STATE.get('lastIP') || gameTitle });
    BUS.emit('brief:generated', { brief, type, projName });

    /* 출력 렌더 */
    renderBriefOut(out, brief, type);
    out.classList.add('show');
    document.getElementById(revId).style.display = 'block';
    document.getElementById('fb2').classList.add('done');
    document.getElementById('fb3').classList.add('active');

    /* 통계 */
    const countKey = type === 'visual' ? 'visualCount' : 'videoCount';
    STATE.set(countKey, STATE.get(countKey) + 1);
    BUS.emit('brief:stat');
  }

  /* 履歴保存 */
  function saveToHistory() {
    const b = STATE.get('lastBrief');
    if (!b) { UI.toast(L('toast_no_brief'), 'err'); return; }
    const deptId = STATE.get('dept');
    const orgs = STATE.get('orgs') || CONFIG.ORGS;
    let deptLabel = deptId || '';
    orgs.forEach(org => { const t = org.teams.find(t => t.id === deptId); if (t) deptLabel = t.label; });
    const isVis = STATE.get('lastBriefType') === 'visual';
    const entry = {
      id:       Date.now(),
      ip:       STATE.get('lastIP') || gv('v-ip') || gv('vid-ip') || gv('p-title') || '',
      name:     STATE.get('lastProjName'),
      anken:    isVis ? gv('v-title') : gv('vid-title'),
      type:     STATE.get('lastBriefType'),
      dept:     deptId,
      deptLabel: deptLabel,
      owner:    STATE.get('lastOwner') || gv('p-owner'),
      priority: STATE.get('priority'),
      date:     new Date().toLocaleDateString('ja-JP'),
      status: 'FIXED',
    };
    const history = JSON.parse(JSON.stringify(STATE.get('briefHistory')));
    const idx = history.findIndex(h => h.name === entry.name && h.type === entry.type);
    if (idx >= 0) history[idx] = entry; else history.unshift(entry);
    STATE.set('briefHistory', history);
    BUS.emit('brief:saved');
    UI.toast(L('toast_hist_saved'), 'ok');
  }

  /* クリップボードコピー */
  function copyBrief() {
    const b = STATE.get('lastBrief');
    if (!b) return;
    const text = `【ブリーフ: ${STATE.get('lastProjName')}】\n概要: ${b.overview||b.overview_kr||''}\n目標: ${b.objective||b.objective_kr||''}\nターゲット: ${b.target||b.target_kr||''}\n注意事項: ${b.notes||b.notes_kr||''}`;
    navigator.clipboard.writeText(text).then(() => UI.toast(L('toast_copied'), 'ok'));
  }

  /* SlackパネルON/OFF */
  function toggleSlack() {
    const p = document.getElementById('slack-panel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
    if (p.style.display === 'block') buildSlackPreview();
  }

  function buildSlackPreview() {
    const b = STATE.get('lastBrief'); if (!b) return;
    const proj = STATE.get('lastProjName');
    document.getElementById('slack-preview').innerHTML =
      '<div class="slack-bar"><div class="slack-app-ic">🤖</div><div><div class="slack-sender">AI Creator Hub</div></div></div>'
      + '<div class="slack-body">✅ <strong>ブリーフ最終確定済み</strong>'
      + '<div class="slack-att"><div class="slack-att-title">📌 ' + proj + '</div>'
      + '<div class="slack-att-body">' + (b.overview||b.overview_kr||'').slice(0,80) + '...' + '</div></div></div>';
  }

  async function sendSlack() {
    const webhook = STATE.get('webhook');
    const b = STATE.get('lastBrief'); if (!b) return;
    const ch = gv('slack-ch') || '#ai-creator-hub';
    if (webhook && webhook.startsWith('https://hooks.slack.com')) {
      const payload = { text: '📋 *新規ブリーフ* | ' + STATE.get('lastProjName'), attachments: [{ color:'#06B6D4', fields: [{ title:'개요', value: b.overview || b.overview_kr.slice(0,100) }, { title:'키워드', value:(b.keywords||[]).join(' · ') }] }] };
      try {
        await fetch(webhook, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        STATE.set('slackSent', STATE.get('slackSent') + 1);
        BUS.emit('brief:stat');
        UI.toast(L('toast_slack_real'), 'ok');
      } catch(e) { UI.toast(L('toast_slack_fail'), 'err'); }
    } else {
      await UI.sleep(700);
      STATE.set('slackSent', STATE.get('slackSent') + 1);
      BUS.emit('brief:stat');
      UI.toast(L('toast_slack_ok', {ch:ch}), 'ok');
    }
  }

  /* ════════════════════════════════════════════════════════
     XLSX出力 — fflate基盤の純粋OOXML直接生成
     · レファレンス画像挿入（指定セル位置に配置）
     · レイアウト設定（行高さ、列幅、セル結合）
     ════════════════════════════════════════════════════════ */


  function _loadFflate(cb) {
    if (typeof fflate !== 'undefined') { cb(); return; }
    // fflate가 아직 파싱 중일 경우 폴링으로 확인 (최대 3초)
    var attempts = 0;
    var timer = setInterval(function() {
      attempts++;
      if (typeof fflate !== 'undefined') {
        clearInterval(timer);
        cb();
      } else if (attempts >= 30) {  // 100ms × 30 = 3초
        clearInterval(timer);
        UI.toast('fflate load error', 'err');
      }
    }, 100);
  }

  function exportXlsx() {
    const b = STATE.get('lastBrief');
    if (!b) { UI.toast(L('toast_no_brief'), 'err'); return; }
    UI.toast('📊 スプレッドシート生成中...', 'info');
    _loadFflate(() => _doXlsxOOXML(b));
  }

  /* base64 → Uint8Array変換 */
  function _b64ToU8(b64) {
    const bin = atob(b64.split(',')[1] || b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  /* セルアドレス → { r, c } */
  function _cellRef(col, row) { return { col: col - 1, row: row - 1 }; }

  /* XML特殊文字エスケープ */
  function _xe(s) {
    return String(s||'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* 実際のOOXML xlsx生成 */
  /* ── After形式 OOXML xlsx生成
     レイアウト:
       A列(22): 항목 라벨 (bg:#111827, bold, 10px)
       B열(77): 값 (11px, wrap)
       C열(73): 레퍼런스 이미지 설명 (11px, wrap)
       Row1    : タイトル "種別_プロジェクト名" — A:C 병합, 20px Bold, bg:#111827
       Row2    : 빈 행
       Row3~5  : メタ (プロジェクト名/生成日/種別)
       Row6    : 빈 구분선 행
       Row7~   : 의뢰 정보 (IP, 프로젝트명, 담당자, 案件名, 우선도, 마감일...)
       Row N   : AI 섹션 (📌概要, 🎯目標, 👥ターゲット, ⚠️注意事項)
       Row N+1 : 빈 행
       Row N+2+: レファレンス画像 — B열: 이미지, C열: 설명
                 1장=헤더A行에 이미지
                 2장이상=각 이미지 별도 행
  ── */

nment wrapText="1" vertical="center" horizontal="center"/></xf></cellXfs></styleSheet>`;

  /* 印刷 */
  function print() {
    const c = document.getElementById('final-doc').innerHTML;
    const win = window.open('','_blank');
    const styleTag  = '<' + 'style>body{font-family:\'Noto Sans JP\',sans-serif;padding:40px;color:#1a1a1a}.preview-doc{box-shadow:none;border:none;padding:0}<' + '/style>';
    const headClose = '<' + '/head>';
    const bodyClose = '<' + '/body>';
    const htmlClose = '<' + '/html>';
    win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ブリーフ</title>'
      + '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">'
      + styleTag + headClose + '<body><div class="preview-doc">' + c + '</div>' + bodyClose + htmlClose);
    win.document.close();
    setTimeout(() => win.print(), 400);
  }

  /* BUS購読: 企画ページ → ブリーフIP/プロジェクト名自動連携 */
  BUS.on('planning:saved', ({ projName, ip, owner }) => {
    const fill = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
    fill('v-ip',        ip);
    fill('v-projname',  projName);
    fill('v-owner',     owner);
    fill('vid-ip',      ip);
    fill('vid-projname',projName);
    fill('vid-owner',   owner);
    /* 優先度スター表示更新 */
    _updateBriefPriority(STATE.get('priority') || 0);
  });

  /* ブリーフフォームの優先度スター・ラベル更新ヘルパー */
  function _updateBriefPriority(n) {
    const texts  = { 1:L('pri_low'), 2:L('pri_mid'), 3:L('pri_high') };
    const colors = { 1:'#6EE7B7', 2:'#FCD34D', 3:'#FDA4AF' };
    ['v','vid'].forEach(prefix => {
      [1,2,3].forEach(i => {
        const el = document.getElementById(prefix + '-pstar-' + i);
        if (el) el.classList.toggle('on', i <= n);
      });
      const lbl = document.getElementById(prefix + '-plabel');
      if (lbl) { lbl.textContent = texts[n] || '—'; lbl.style.color = colors[n] || 'var(--muted)'; }
    });
  }

  /* ページ進入時もSTATEに保存された値を復元 */
  BUS.on('page:changed', ({ page }) => {
    if (page !== 'brief') return;
    const ip    = STATE.get('lastIP')    || '';
    const proj  = STATE.get('lastProjName') || '';
    const owner = STATE.get('lastOwner') || '';
    const pri   = STATE.get('priority') || 0;
    const fill  = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
    fill('v-ip',        ip);
    fill('v-projname',  proj);
    fill('v-owner',     owner);
    fill('vid-ip',      ip);
    fill('vid-projname',proj);
    fill('vid-owner',   owner);
    /* 優先度スター表示更新 */
    _updateBriefPriority(pri);
  });

  return { render, switchType, generate, goToReview, goToFinal, backToGenerate, backToReview, saveToHistory, copyBrief, toggleSlack, sendSlack, exportXlsx, print, uploadRef, sbAddCut, sbDelCut, sbImgUpload, sbImgDel };
})();

BLOCK.Archive = (() => {
  let filter = 'all';
  const TYPE_BADGE = { video:'tb-v', image:'tb-i', doc:'tb-d' };

  function render() {
    const page = document.getElementById('page-archive');
    page.innerHTML = `
      <div class="ph"><div class="ph-tag">03 / WORKFLOW</div><h1>${L('arch_title')}</h1><p>${L('arch_sub')}</p></div>
      <div class="search-wrap"><span class="search-ic">🔍</span><input placeholder="${L('arch_search_ph')}" id="arch-q" oninput="BLOCK.Archive.filterItems(this.value)"></div>
      <div class="filter-row" id="arch-filters">
        <button class="fbtn on" onclick="BLOCK.Archive.setFilter(this,'all')">${L('arch_all')}</button>
        <button class="fbtn" onclick="BLOCK.Archive.setFilter(this,'video')">Video</button>
        <button class="fbtn" onclick="BLOCK.Archive.setFilter(this,'image')">Image</button>
        <button class="fbtn" onclick="BLOCK.Archive.setFilter(this,'doc')">Document</button>
        <button class="fbtn" onclick="BLOCK.Archive.setFilter(this,'2025')">2025</button>
        <button class="fbtn" onclick="BLOCK.Archive.setFilter(this,'2024')">2024</button>
      </div>
      <div class="arch-grid" id="arch-grid"></div>`;
    renderItems(CONFIG.ARCHIVE);
  }

  function renderItems(items) {
    const grid = document.getElementById('arch-grid');
    if (!grid) return;
    if (!items.length) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">' + L('arch_empty') + '</div>'; return; }
    const TYPE_STYLE = { video:'background:rgba(244,63,94,.12);color:var(--rose);border:1px solid rgba(244,63,94,.2)', image:'background:rgba(16,185,129,.12);color:var(--emerald);border:1px solid rgba(16,185,129,.2)', doc:'background:rgba(6,182,212,.12);color:var(--cyan);border:1px solid rgba(6,182,212,.2)' };
    grid.innerHTML = items.map(item => `
      <div class="arch-item" onclick="UI.toast('${item.name} ' + L('arch_ref_toast') + "','info'")">
        <div class="arch-thumb" style="background:${item.bg}">
          <span style="position:relative;z-index:1">${item.em}</span>
          <span class="arch-badge" style="font-size:8px;padding:2px 5px;border-radius:3px;font-weight:700;${TYPE_STYLE[item.type]||''}">${item.type.toUpperCase()}</span>
        </div>
        <div class="arch-info">
          <div class="arch-name" title="${item.name}">${item.name}</div>
          <div class="arch-meta">${item.dept} · ${item.year}</div>
          <div class="arch-tags">${item.tags.map(t=>'<span class="arch-tag">'+t+'</span>').join('')}</div>
        </div>
      </div>`).join('');
  }

  function setFilter(el, f) {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
    el.classList.add('on');
    filter = f;
    filterItems(document.getElementById('arch-q')?.value || '');
  }

  function filterItems(q) {
    const results = CONFIG.ARCHIVE.filter(i => {
      const mf = filter === 'all' || i.type === filter || i.year === filter;
      const mq = !q || i.name.toLowerCase().includes(q.toLowerCase()) || i.tags.some(t => t.includes(q));
      return mf && mq;
    });
    renderItems(results);
  }

  return { render, setFilter, filterItems };
})();

  /* ── タブ1: 組織/チーム/メンバー ── */
  function renderOrgPanel() {
    const orgs = STATE.get('orgs') || CONFIG.ORGS;
    let html = '';
    orgs.forEach((org, oi) => {
      const badgeStyle = org.color === 'orange'
        ? 'background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.25);'
        : 'background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.25);';

            + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'
            + '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:4px;text-transform:uppercase;' + badgeStyle + '">' + org.name + '</span>'
            + '<button class="btn btn-outline btn-xs" onclick="BLOCK.Settings.addTeam(' + oi + ')">＋ チーム追加</button>'
            + '</div>';
      org.teams.forEach((team, ti) => {
        const isDefault = CONFIG.ORGS[oi]?.teams.some(t => t.id === team.id);
        html += '<div class="team-card ' + org.color + '" id="tc-' + team.id + '">'
              + '<div class="team-header" onclick="BLOCK.Settings.toggleTeam(\'' + team.id + '\')">'
              + '<span class="team-name">' + team.label + '</span>'
              + '<span class="team-count" id="tcnt-' + team.id + '">' + team.members.length + '名</span>'
              + '<span class="team-toggle" id="ttog-' + team.id + '">▾</span>'
              + (!isDefault ? '<button class="team-del" onclick="event.stopPropagation();BLOCK.Settings.deleteTeam(' + oi + ',' + ti + ')">削除</button>' : '')
              + '</div>'
              + '<div class="member-panel" id="mp-' + team.id + '" style="display:none;">'
              + '<div class="member-list" id="ml-' + team.id + '">' + renderMemberList(team.id, oi, ti, team.members) + '</div>'
              + '<div class="member-add-row">'
              + '<input id="mi-' + team.id + '" placeholder="' + L('member_add_ph') + '" style="flex:1;font-size:11px;" onkeydown="if(event.key===\'Enter\')BLOCK.Settings.addMember(' + oi + ',' + ti + ')">'
              + '<button class="btn btn-emerald btn-sm" onclick="BLOCK.Settings.addMember(' + oi + ',' + ti + ')">＋ 追加</button>'
              + '</div></div></div>';
      });
      html += '</div>';
    });
    return html;
  }

  function renderMemberList(teamId, oi, ti, members) {
    if (!members.length) return '<div style="font-size:11px;color:var(--muted);padding:5px 0;">' + L('member_none') + '</div>';
    return members.map((m, mi) =>
      '<div class="member-row">'
      + '<span class="member-name">' + m + '</span>'
      + '<button class="member-del" onclick="BLOCK.Settings.deleteMember(' + oi + ',' + ti + ',' + mi + ')">✕</button>'
      + '</div>'
    ).join('');
  }

  function toggleTeam(teamId) {
    const panel = document.getElementById('mp-' + teamId);
    const tog   = document.getElementById('ttog-' + teamId);
    if (!panel) return;
    const open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    if (tog) tog.classList.toggle('open', !open);
    if (!open) setTimeout(() => document.getElementById('mi-' + teamId)?.focus(), 30);
  }

  function addTeam(orgIdx) {
    const name = prompt(L('prompt_team_name'));
    if (!name?.trim()) return;
    /* [FIX 2] DeepCopy — 元STATE参照の直接変異防止 */
    const orgs = JSON.parse(JSON.stringify(STATE.get('orgs')));
    const newTeam = { id: 'team_' + Date.now(), label: name.trim(), members: [] };
    orgs[orgIdx].teams.push(newTeam);
    STATE.set('orgs', orgs);
    BUS.emit('org:updated', orgs);
    UI.toast(L('toast_team_add', {name:name.trim()}), 'ok');
  }

  function deleteTeam(orgIdx, teamIdx) {
    /* [FIX 2] DeepCopy — 元STATE参照の直接変異防止 */
    const orgs = JSON.parse(JSON.stringify(STATE.get('orgs')));
    const name = orgs[orgIdx].teams[teamIdx].label;
    if (!confirm(L('confirm_del_team', {name:name}))) return;
    orgs[orgIdx].teams.splice(teamIdx, 1);
    STATE.set('orgs', orgs);
    BUS.emit('org:updated', orgs);
    UI.toast(L('toast_team_del', {name:name}), 'ok');
  }

  function addMember(orgIdx, teamIdx) {
    /* [FIX 2] DeepCopy — 元STATE参照の直接変異防止 */
    const orgs = JSON.parse(JSON.stringify(STATE.get('orgs')));
    const team  = orgs[orgIdx].teams[teamIdx];
    const input = document.getElementById('mi-' + team.id);
    const name  = input?.value.trim();
    if (!name) { UI.toast(L('toast_member_ph'), 'err'); return; }
    if (team.members.includes(name)) { UI.toast(L('toast_member_dup'), 'err'); return; }
    team.members.push(name);
    STATE.set('orgs', orgs);
    /* 部分更新 */
    document.getElementById('ml-' + team.id).innerHTML = renderMemberList(team.id, orgIdx, teamIdx, team.members);
    const cnt = document.getElementById('tcnt-' + team.id);
    if (cnt) cnt.textContent = team.members.length + (STATE.get('lang')==='KR'?'명':'名');
    if (input) input.value = '';
    BUS.emit('org:updated', orgs);
    UI.toast(L('toast_member_add', {name:name}), 'ok');
  }

  function deleteMember(orgIdx, teamIdx, memberIdx) {
    /* [FIX 2] DeepCopy — 元STATE参照の直接変異防止 */
    const orgs = JSON.parse(JSON.stringify(STATE.get('orgs')));
    const team  = orgs[orgIdx].teams[teamIdx];
    const name  = team.members[memberIdx];
    team.members.splice(memberIdx, 1);
    STATE.set('orgs', orgs);
    document.getElementById('ml-' + team.id).innerHTML = renderMemberList(team.id, orgIdx, teamIdx, team.members);
    const cnt = document.getElementById('tcnt-' + team.id);
    if (cnt) cnt.textContent = team.members.length + (STATE.get('lang')==='KR'?'명':'名');

  /* 保存済みAPI値復元 */
  function restoreApiValues() {
    const el = (id) => document.getElementById(id);
    if (el('cfg-apikey'))   el('cfg-apikey').value   = STATE.get('apiKey') || '';
    if (el('cfg-webhook'))  el('cfg-webhook').value  = STATE.get('webhook') || '';
    if (el('cfg-provider')) el('cfg-provider').value = STATE.get('provider') || 'claude';
    if (el('cfg-drive-client-id')) el('cfg-drive-client-id').value = STATE.get('driveClientId') || '';
    if (el('cfg-drive-folder-id')) el('cfg-drive-folder-id').value = STATE.get('driveFolderId') || '';
    onProviderChange();
    BLOCK.API.updateDriveUI();
  }

  function onProviderChange() {
    const p = document.getElementById('cfg-provider')?.value || 'claude';
    STATE.set('provider', p);
    const modelSel = document.getElementById('cfg-model');
    if (modelSel) {
      const models = CONFIG.AI_MODELS[p] || ['custom'];
      modelSel.innerHTML = models.map(m => '<option value="' + m + '">' + m + '</option>').join('')
        + '<option value="custom">' + L('direct_input') + '</option>';
      const saved = STATE.get('model');
      if (saved) modelSel.value = saved;
    }
    const placeholders = { claude:'sk-ant-...', openai:'sk-...', gemini:'AIza...', custom:'API Key' };
    const keyEl = document.getElementById('cfg-apikey');
    if (keyEl) keyEl.placeholder = placeholders[p] || 'API Key';
    const wrap = document.getElementById('custom-model-wrap');
    if (wrap) wrap.style.display = p === 'custom' ? 'block' : 'none';
  }

  function checkKey(val) {
    const st = document.getElementById('key-status');
    if (!st) return;
    if (val.length > 10) { st.style.color = 'var(--emerald)'; st.textContent = L('apikey_ok'); }
    else if (val.length > 2) { st.style.color = 'var(--amber)'; st.textContent = L('apikey_warn'); }
    else { st.style.color = 'var(--muted)'; st.textContent = L('apikey_hint'); }
  }
